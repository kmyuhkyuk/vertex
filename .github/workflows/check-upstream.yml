name: Sync Upstream and Trigger Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_and_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: vertex-app/vertex
          upstream_sync_branch: stable
          target_sync_branch: stable
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Run dockerhub-multi workflow
        if: steps.sync.outputs.has_new_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-docker-multiarch-image.yml \
            --repo "$GITHUB_REPOSITORY"